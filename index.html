<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5efe3">
  <title>测测你的灵魂对应哪位中国历史人物</title>
  <link rel="stylesheet" href="style.css">
  <script src="questions.js" defer></script>
  <script src="quiz.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="brand"><span class="seal" aria-hidden="true">照</span> 古人照影</div>
    <span class="edition">历史人物人格测试</span>
  </header>
  <main id="app">
    <section class="hero" aria-labelledby="home-title">
      <div class="hero-copy">
        <div class="eyebrow">一场跨越千年的照面</div>
        <h1 id="home-title">测测你的灵魂<br>对应哪位<span>中国历史人物</span></h1>
        <p>从周末如何度过，到遇见分歧时如何开口。<br class="desktop">凭直觉回答，看看你的性格和谁有几分相似。</p>
        <button type="button" class="primary" id="start">开始测试</button>
        <div class="meta">40 道生活题 <span aria-hidden="true">/</span> 约 5–8 分钟</div>
      </div>
      <div class="art" aria-hidden="true">
        <div class="sun"></div>
        <div class="ridge far"></div><div class="ridge middle"></div><div class="ridge near"></div>
        <div class="river"></div>
        <div class="inscription">山河之間<br>自有知己</div>
      </div>
    </section>
  </main>
  <footer>结果仅供娱乐 · 不作为心理诊断依据</footer>
</body>
</html>
